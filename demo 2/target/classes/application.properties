# Change the default server port to avoid the "Port 8080 already in use" error
server.port=8081

# PostgreSQL Database Connection Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/my_crud_db
spring.datasource.username=postgres
spring.datasource.password=200306

# Hibernate Configuration (Automatically creates/updates your database tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect