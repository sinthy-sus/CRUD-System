<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management CRUD</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            margin-top: 0;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.cancel-btn {
            background-color: #6c757d;
            display: none;
        }
        button.cancel-btn:hover {
            background-color: #5a6268;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
        }
        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 5px;
        }
        .edit-btn {
            background-color: #ffc107;
            color: #212529;
        }
        .edit-btn:hover {
            background-color: #e0a800;
        }
        .delete-btn {
            background-color: #dc3545;
        }
        .delete-btn:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>User Management System</h1>

    <!-- Form for Create & Update -->
    <h2 id="form-title">Add New User</h2>
    <div class="form-group">
        <input type="hidden" id="user-id">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <button id="save-btn" onclick="saveUser()">Add User</button>
        <button id="cancel-btn" class="cancel-btn" onclick="resetForm()">Cancel</button>
    </div>

    <!-- Users Table (Read & Delete) -->
    <h2>All Users</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="user-table-body">
        <!-- Rows inserted dynamically by JS -->
        </tbody>
    </table>
</div>

<script>
    const API_URL = "http://localhost:8081/users";

    // 1. Fetch and render all users (READ)
    async function loadUsers() {
        try {
            const res = await fetch(API_URL);
            const users = await res.json();
            const tbody = document.getElementById("user-table-body");
            tbody.innerHTML = "";

            if (users.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No users found</td></tr>";
                return;
            }

            users.forEach(user => {
                const row = document.createElement("tr");
                row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>
              <button class="action-btn edit-btn" onclick="prepareEdit(${user.id}, '${user.name}', '${user.email}')">Edit</button>
              <button class="action-btn delete-btn" onclick="deleteUser(${user.id})">Delete</button>
            </td>
          `;
                tbody.appendChild(row);
            });
        } catch (err) {
            console.error("Error loading users:", err);
        }
    }

    // 2. Save user (Handles both CREATE and UPDATE)
    async function saveUser() {
        const id = document.getElementById("user-id").value;
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();

        if (!name || !email) {
            alert("Please provide both name and email.");
            return;
        }

        const payload = { name, email };

        if (id) {
            // UPDATE (PUT)
            await fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        } else {
            // CREATE (POST)
            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        }

        resetForm();
        loadUsers();
    }

    // 3. Populate form for editing (UPDATE setup)
    function prepareEdit(id, name, email) {
        document.getElementById("user-id").value = id;
        document.getElementById("name").value = name;
        document.getElementById("email").value = email;

        document.getElementById("form-title").innerText = "Update User";
        document.getElementById("save-btn").innerText = "Save Changes";
        document.getElementById("cancel-btn").style.display = "inline-block";
    }

    // 4. Delete user (DELETE)
    async function deleteUser(id) {
        if (confirm("Are you sure you want to delete this user?")) {
            await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            loadUsers();
        }
    }

    // Reset the form fields
    function resetForm() {
        document.getElementById("user-id").value = "";
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";

        document.getElementById("form-title").innerText = "Add New User";
        document.getElementById("save-btn").innerText = "Add User";
        document.getElementById("cancel-btn").style.display = "none";
    }

    // Initial load
    loadUsers();
</script>
</body>
</html>
